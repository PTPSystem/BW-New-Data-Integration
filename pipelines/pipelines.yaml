# Pipeline definitions for MDX → Dataverse sync.
# Each pipeline specifies:
# - OLAP catalog (optional; defaults to config olap.catalog)
# - MDX query template (string)
# - Parser to use for XMLA response
# - Mapping file for DataFrame → Dataverse record transformation

pipelines:
  daily_sales:
    catalog: OARS Franchise
    atscale_project: OARS
    parser: celldata
    mapping: mappings/daily_sales.yaml
    hierarchy_mappings:
      - pattern: "Stores.*Store Number"
        field: "StoreNumber"
      - pattern: "Calendar.*Date"
        field: "CalendarDate"
    # Preferred path after ednacubes shutdown: AtScale public SQL API
    sql: |-
      SELECT
        `Store Number`,
        `Calendar Date`,
        SUM(`TY Net Sales USD`) AS `TY Net Sales USD`,
        SUM(`L2Y Comp Net Sales USD`) AS `L2Y Comp Net Sales USD`,
        SUM(`L3Y Comp Net Sales USD`) AS `L3Y Comp Net Sales USD`,
        SUM(`LY Comp Net Sales USD`) AS `LY Comp Net Sales USD`,
        SUM(`TY Target Food Cost USD`) AS `TY Target Food Cost USD`,
        SUM(`Actual Food Cost USD`) AS `Actual Food Cost USD`,
        SUM(`FLMD USD`) AS `FLMD USD`,
        SUM(`Target Profit after FLM Local (Fran)`) AS `Target Profit after FLM Local (Fran)`,
        SUM(`Actual FLM w/o Vacation Accrual Local`) AS `Actual FLM w/o Vacation Accrual Local`,
        SUM(`Actual Labor $ USD`) AS `Actual Labor $ USD`,
        SUM(`HS Total Actual Hours`) AS `HS Total Actual Hours`,
        SUM(`Store Days`) AS `Store Days`,
        SUM(`Make Time Minutes`) AS `Make Time Minutes`,
        SUM(`TY Orders`) AS `TY Orders`,
        SUM(`Rack Time Minutes`) AS `Rack Time Minutes`,
        SUM(`Total OTD Time (Hours)`) AS `Total OTD Time (Hours)`,
        SUM(`Deliveries`) AS `Deliveries`,
        SUM(`BOZOCORO Orders`) AS `BOZOCORO Orders`,
        SUM(`OTD Order Count`) AS `OTD Order Count`,
        SUM(`Total Cash Over/Short USD`) AS `Total Cash Over/Short USD`,
        SUM(`LY Orders`) AS `LY Orders`,
        SUM(`TY Total OSAT Survey Count`) AS `TY Total OSAT Survey Count`,
        SUM(`TY OSAT Satisfied Survey Count`) AS `TY OSAT Satisfied Survey Count`,
        SUM(`Total Calls`) AS `Total Calls`,
        SUM(`Answered Calls`) AS `Answered Calls`,
        SUM(`FLMDPC USD (Fran)`) AS `FLMDPC USD (Fran)`,
        SUM(`m_ty_agg_commission_local_sum`) AS `m_ty_agg_commission_local_sum`,
        SUM(`TY Dispatched Delivery Orders`) AS `TY Dispatched Delivery Orders`,
        AVG(`Avg TTDT`) AS `Avg TTDT`,
        SUM(`Mileage Cost Local`) AS `Mileage Cost Local`,
        SUM(`Discounts USD`) AS `Discounts USD`,
        SUM(`TY Total Order Accuracy Survey Count`) AS `TY Total Order Accuracy Survey Count`,
        AVG(`Order Accuracy %`) AS `Order Accuracy %`,
        AVG(`SMG Avg Closure`) AS `SMG Avg Closure`,
        SUM(`SMG Cases Opened`) AS `SMG Cases Opened`,
        SUM(`SMG Cases Resolved`) AS `SMG Cases Resolved`,
        AVG(`SMG Value %`) AS `SMG Value %`,
        SUM(`Singles`) AS `Singles`,
        SUM(`Doubles`) AS `Doubles`,
        SUM(`Triples Plus`) AS `Triples Plus`,
        SUM(`Runs`) AS `Runs`,
        SUM(`TTDT Orders`) AS `TTDT Orders`,
        SUM(`To The Door Time for Dispatch Orders`) AS `To The Door Time for Dispatch Orders`,
        AVG(`To The Door Time Minutes`) AS `To The Door Time Minutes`,
        SUM(`TY Taste Of Food Good Survey Count`) AS `TY Taste Of Food Good Survey Count`,
        SUM(`TY Total Taste Of Food Survey Count`) AS `TY Total Taste Of Food Survey Count`,
        SUM(`TY Order Accuracy Good Survey Count`) AS `TY Order Accuracy Good Survey Count`
      FROM OARS
      WHERE `Calendar Date` BETWEEN DATE '${start_date}' AND DATE '${end_date}'
      GROUP BY `Store Number`, `Calendar Date`
      ORDER BY `Calendar Date`, `Store Number`
    mdx: |-
      SELECT 
      {
          [Measures].[TY Net Sales USD],
          [Measures].[L2Y Comp Net Sales USD],
          [Measures].[L3Y Comp Net Sales USD],
          [Measures].[LY Comp Net Sales USD],
          [Measures].[TY Target Food Cost USD],
          [Measures].[Actual Food Cost USD],
          [Measures].[FLMD USD],
          [Measures].[Target Profit after FLM Local (Fran)],
          [Measures].[Actual FLM w/o Vacation Accrual Local],
          [Measures].[Actual Labor $ USD],
          [Measures].[HS Total Actual Hours],
          [Measures].[Store Days],
          [Measures].[Make Time Minutes],
          [Measures].[TY Orders],
          [Measures].[Rack Time Minutes],
          [Measures].[Total OTD Time (Hours)],
          [Measures].[Deliveries],
          [Measures].[BOZOCORO Orders],
          [Measures].[OTD Order Count],
          [Measures].[Total Cash Over/Short USD],
          [Measures].[LY Orders],
          [Measures].[TY Total OSAT Survey Count],
          [Measures].[TY OSAT Satisfied Survey Count],
          [Measures].[Total Calls],
          [Measures].[Answered Calls],
          [Measures].[FLMDPC USD (Fran)],
          [Measures].[m_ty_agg_commission_local_sum],
          [Measures].[TY Dispatched Delivery Orders],
          [Measures].[Avg TTDT],
          [Measures].[Mileage Cost Local],
          [Measures].[Discounts USD],
          [Measures].[TY Total Order Accuracy Survey Count],
          [Measures].[Order Accuracy %],
          [Measures].[SMG Avg Closure],
          [Measures].[SMG Cases Opened],
          [Measures].[SMG Cases Resolved],
          [Measures].[SMG Value %],
          [Measures].[Singles],
          [Measures].[Doubles],
          [Measures].[Triples Plus],
          [Measures].[Runs],
          [Measures].[TTDT Orders],
          [Measures].[To The Door Time for Dispatch Orders],
          [Measures].[To The Door Time Minutes],
          [Measures].[TY Taste Of Food Good Survey Count],
          [Measures].[TY Total Taste Of Food Survey Count],
          [Measures].[TY Order Accuracy Good Survey Count]
      } 
      DIMENSION PROPERTIES PARENT_UNIQUE_NAME,HIERARCHY_UNIQUE_NAME ON COLUMNS,
      NON EMPTY CrossJoin(
          Hierarchize({[Stores].[Store Number].[Store Number].AllMembers}),
          Hierarchize({[Calendar].[Calendar Date].[Calendar Date].AllMembers})
      )
      DIMENSION PROPERTIES PARENT_UNIQUE_NAME,HIERARCHY_UNIQUE_NAME ON ROWS
      FROM [OARS Franchise]
      WHERE (${slicer})
      CELL PROPERTIES VALUE, FORMAT_STRING, LANGUAGE, BACK_COLOR, FORE_COLOR, FONT_FLAGS

  sales_channel:
    catalog: OARS Franchise
    atscale_project: OARS
    parser: sales_channel_daily
    mapping: mappings/sales_channel.yaml
    hierarchy_mappings:
      - pattern: "Stores.*Store Number"
        field: "StoreNumber"
      - pattern: "Calendar.*Date"
        field: "CalendarDate"
      - pattern: "Source.*Actor"
        field: "SourceActor"
      - pattern: "Source.*Channel"
        field: "SourceChannel"
      - pattern: "Day Part.*Day Part"
        field: "DayPart"
    sql: |-
      SELECT
        `Store Number`,
        `Calendar Date`,
        `Source Actor`,
        `Source Channel`,
        `Day Part`,
        SUM(`TY Net Sales USD`) AS `TY Net Sales USD`,
        SUM(`TY Orders`) AS `TY Orders`,
        SUM(`Discounts USD`) AS `Discounts USD`,
        SUM(`LY Net Sales USD`) AS `LY Net Sales USD`,
        SUM(`LY Orders`) AS `LY Orders`
      FROM OARS
      WHERE `Calendar Date` BETWEEN DATE '${start_date}' AND DATE '${end_date}'
      GROUP BY `Store Number`, `Calendar Date`, `Source Actor`, `Source Channel`, `Day Part`
      ORDER BY `Calendar Date`, `Store Number`
    mdx: |-
      SELECT {[Measures].[TY Net Sales USD],[Measures].[TY Orders],[Measures].[Discounts USD],[Measures].[LY Net Sales USD],[Measures].[LY Orders]} DIMENSION PROPERTIES PARENT_UNIQUE_NAME,HIERARCHY_UNIQUE_NAME ON COLUMNS , 
      NON EMPTY CrossJoin(CrossJoin(CrossJoin(CrossJoin(Hierarchize({[Stores].[Store Number].[Store Number].AllMembers}), Hierarchize({[Calendar].[Calendar Date].[Calendar Date].AllMembers})), Hierarchize({[Source Channel].[Source Actor].[Source Actor].AllMembers})), 
      Hierarchize({[Source Channel].[Source Channel].[Source Channel].AllMembers})), Hierarchize({[Day Part Dimension].[Day Part].[Day Part].AllMembers})) DIMENSION PROPERTIES PARENT_UNIQUE_NAME,HIERARCHY_UNIQUE_NAME ON ROWS  FROM [OARS Franchise] 
      WHERE (${slicer}) CELL PROPERTIES VALUE, FORMAT_STRING, LANGUAGE, BACK_COLOR, FORE_COLOR, FONT_FLAGS

  offers:
    catalog: Offers
    atscale_project: Offers
    parser: offers
    mapping: mappings/offers.yaml
    hierarchy_mappings:
      - pattern: "Calendar.*Date"
        field: "CalendarDate"
      - pattern: "Stores.*Store Number"
        field: "StoreNumber"
      - pattern: "Offer Code.*Hierarchy"
        field: "OfferCode"
      - pattern: "Offer.*POS Description"
        field: "OfferPOSDescription"
    sql: |-
      SELECT
        `Store Number`,
        `Calendar Date`,
        `Offer Code`,
        `Offer POS Description`,
        SUM(`Redeemed Count`) AS `Redeemed Count`,
        SUM(`Discount Amount USD`) AS `Discount Amount USD`,
        SUM(`Gross Margin USD`) AS `Gross Margin USD`,
        AVG(`Order Mix %`) AS `Order Mix %`,
        AVG(`Sales Mix USD %`) AS `Sales Mix USD %`,
        SUM(`Net Sales USD`) AS `Net Sales USD`,
        SUM(`Order Count`) AS `Order Count`,
        SUM(`Target Food Cost USD`) AS `Target Food Cost USD`
      FROM Offers
      WHERE `Calendar Date` BETWEEN DATE '${start_date}' AND DATE '${end_date}'
      GROUP BY `Store Number`, `Calendar Date`, `Offer Code`, `Offer POS Description`
      ORDER BY `Calendar Date`, `Store Number`
    mdx: |-
      SELECT {
          [Measures].[Redeemed Count],
          [Measures].[Discount Amount USD],
          [Measures].[Gross Margin USD],
          [Measures].[Order Mix %],
          [Measures].[Sales Mix USD %],
          [Measures].[Net Sales USD],
          [Measures].[Order Count],
          [Measures].[Target Food Cost USD]
      } 
      DIMENSION PROPERTIES PARENT_UNIQUE_NAME,HIERARCHY_UNIQUE_NAME ON COLUMNS, 
      NON EMPTY CrossJoin(CrossJoin(CrossJoin(
          Hierarchize({[Calendar].[Calendar Date].[Calendar Date].AllMembers}), 
          Hierarchize({[Stores].[Store Number].[Store Number].AllMembers})), 
          Hierarchize({[Offer Code].[Offer Code Hierarchy].[Offer Code Level].AllMembers})), 
          Hierarchize({[Offer Code].[Offer POS Description].[Offer POS Description].AllMembers})) 
      DIMENSION PROPERTIES PARENT_UNIQUE_NAME,HIERARCHY_UNIQUE_NAME ON ROWS  
      FROM [Offers] 
      WHERE (${slicer}) 
      CELL PROPERTIES VALUE, FORMAT_STRING, LANGUAGE, BACK_COLOR, FORE_COLOR, FONT_FLAGS

  inventory:
    catalog: OARS Franchise
    atscale_project: OARS
    parser: inventory
    mapping: mappings/inventory.yaml
    hierarchy_mappings:
      - pattern: ".*Item_Number"
        field: "ItemNumber"
      - pattern: "Calendar.*Date"
        field: "CalendarDate"
      - pattern: "Stores.*Store Number"
        field: "StoreNumber"
      - pattern: ".*Item_Description"
        field: "ItemDescription"
    sql: |-
      SELECT
        `Store Number`,
        `Calendar Date`,
        `Item_Number`,
        `Item_Description`,
        SUM(`Qty On Hand`) AS `Qty On Hand`
      FROM OARS
      WHERE `Calendar Date` BETWEEN DATE '${start_date}' AND DATE '${end_date}'
      GROUP BY `Store Number`, `Calendar Date`, `Item_Number`, `Item_Description`
      ORDER BY `Calendar Date`, `Store Number`, `Item_Number`
    mdx: |-
      SELECT {[Measures].[Qty On Hand]} 
      DIMENSION PROPERTIES PARENT_UNIQUE_NAME,HIERARCHY_UNIQUE_NAME ON COLUMNS, 
      NON EMPTY CrossJoin(CrossJoin(CrossJoin(
          Hierarchize({[Inventory Dimensions].[Item_Number].[Item_Number].AllMembers}), 
          Hierarchize({[Calendar].[Calendar Date].[Calendar Date].AllMembers})), 
          Hierarchize({[Stores].[Store Number].[Store Number].AllMembers})), 
          Hierarchize({[Inventory - Description].[Item_Description].[Item_Description].AllMembers})) 
      DIMENSION PROPERTIES PARENT_UNIQUE_NAME,HIERARCHY_UNIQUE_NAME ON ROWS
      FROM [OARS Franchise] 
      WHERE (${slicer}) 
      CELL PROPERTIES VALUE, FORMAT_STRING, LANGUAGE, BACK_COLOR, FORE_COLOR, FONT_FLAGS

  clock_in_out:
    catalog: VBO
    atscale_project: VBO
    parser: celldata
    mapping: mappings/clock_in_out.yaml
    hierarchy_mappings:
      - pattern: "Stores.*Store Number"
        field: "StoreNumber"
      - pattern: "Calendar.*Date"
        field: "CalendarDate"
      - pattern: "Employee Name.*Employee_Name"
        field: "EmployeeName"
      - pattern: "System User ID.*System_User_ID"
        field: "SystemUserID"
    sql: |-
      SELECT
        `Store Number`,
        `Calendar Date`,
        `Employee_Name Level`,
        `System_User_ID Level`,
        MAX(`Actual Clock In Ts`) AS `Actual Clock In Ts`,
        MAX(`Actual Clock Out Ts`) AS `Actual Clock Out Ts`,
        SUM(`m_reg_hours_worked_sum`) AS `m_reg_hours_worked_sum`,
        SUM(`m_ovt_hours_worked_sum`) AS `m_ovt_hours_worked_sum`,
        SUM(`m_total_hours_worked_sum`) AS `m_total_hours_worked_sum`,
        SUM(`m_total_pay_usd_sum`) AS `m_total_pay_usd_sum`,
        SUM(`m_reg_pay_usd_sum`) AS `m_reg_pay_usd_sum`,
        SUM(`m_ovt_pay_usd_sum`) AS `m_ovt_pay_usd_sum`
      FROM VBO
      WHERE `Calendar Date` BETWEEN DATE '${start_date}' AND DATE '${end_date}'
      GROUP BY `Store Number`, `Calendar Date`, `Employee_Name Level`, `System_User_ID Level`
      ORDER BY `Calendar Date`, `Store Number`
    mdx: |-
      SELECT {
          [Measures].[Actual Clock In Ts],
          [Measures].[Actual Clock Out Ts],
          [Measures].[m_reg_hours_worked_sum],
          [Measures].[m_ovt_hours_worked_sum],
          [Measures].[m_total_hours_worked_sum],
          [Measures].[m_total_pay_usd_sum],
          [Measures].[m_reg_pay_usd_sum],
          [Measures].[m_ovt_pay_usd_sum]
      } 
      DIMENSION PROPERTIES PARENT_UNIQUE_NAME,HIERARCHY_UNIQUE_NAME ON COLUMNS, 
      NON EMPTY CrossJoin(CrossJoin(CrossJoin(
          Hierarchize({DrilldownLevel({[Stores].[Store Number].[All]},,,INCLUDE_CALC_MEMBERS)}), 
          Hierarchize({DrilldownLevel({[Calendar].[Calendar Date].[All]},,,INCLUDE_CALC_MEMBERS)})), 
          Hierarchize({DrilldownLevel({[Employee Name].[Employee_Name Hierarchy].[All]},,,INCLUDE_CALC_MEMBERS)})), 
          Hierarchize({DrilldownLevel({[System User ID].[System_User_ID Hierarchy].[All]},,,INCLUDE_CALC_MEMBERS)})) 
      DIMENSION PROPERTIES PARENT_UNIQUE_NAME,HIERARCHY_UNIQUE_NAME ON ROWS
      FROM [VBO] 
      WHERE (${slicer}) 
      CELL PROPERTIES VALUE, FORMAT_STRING, LANGUAGE, BACK_COLOR, FORE_COLOR, FONT_FLAGS





